{# About "centered": narrow centred copy, photos in a wide row underneath. #}
<section id="about" class="bg-white">
  <div class="max-w-6xl mx-auto px-6 py-20">
    <div class="mx-auto max-w-2xl text-center">
      <p class="text-sm font-semibold uppercase tracking-widest text-[var(--accent)]">About</p>
      <h2 class="mt-2 text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900">{{ business_name }}</h2>
      <p class="mt-5 text-lg leading-relaxed text-slate-600">{{ about }}</p>
      {% if phone %}
      <a href="tel:{{ phone_href }}" class="mt-8 inline-block rounded-lg bg-[var(--accent)] px-6 py-3 font-semibold text-white hover:opacity-90 transition">Call {{ phone }}</a>
      {% endif %}
    </div>
    {% if gallery_images %}
    <div class="mt-14 grid gap-5 {% if gallery_images|length >= 2 %}sm:grid-cols-2{% endif %}">
      {% for img in gallery_images %}
      <img src="{{ img }}" alt="" class="aspect-[16/10] w-full rounded-3xl object-cover shadow-lg">
      {% endfor %}
    </div>
    {% endif %}
  </div>
</section>
