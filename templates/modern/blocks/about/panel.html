{# About "panel": dark accent band, copy in white, one framed photo beside it. #}
<section id="about" class="bg-[var(--accent-dark)] text-white">
  <div class="max-w-6xl mx-auto px-6 py-20 grid gap-12 md:grid-cols-5 items-center">
    <div class="md:col-span-3">
      <p class="text-sm font-semibold uppercase tracking-widest text-white/70">About</p>
      <h2 class="mt-2 text-3xl md:text-4xl font-extrabold tracking-tight">{{ business_name }}</h2>
      <p class="mt-5 text-lg leading-relaxed text-white/85">{{ about }}</p>
      <div class="mt-8 flex flex-wrap gap-3">
        {% if phone %}
        <a href="tel:{{ phone_href }}" class="rounded-lg bg-white px-6 py-3 font-semibold text-slate-900 hover:bg-slate-100 transition">Call {{ phone }}</a>
        {% endif %}
        <a href="#contact" class="rounded-lg px-6 py-3 font-semibold ring-1 ring-white/40 hover:bg-white/10 transition">{{ cta_secondary }}</a>
      </div>
    </div>
    <div class="md:col-span-2">
      {% if gallery_images %}
      <img src="{{ gallery_images[0] }}" alt="" class="aspect-[4/5] w-full rounded-3xl object-cover shadow-2xl ring-1 ring-white/20">
      {% else %}
      <div class="rounded-3xl bg-white/10 p-10 ring-1 ring-white/20">
        <p class="text-6xl">{{ icon }}</p>
        <p class="mt-4 text-3xl font-extrabold">{{ city }}</p>
        <p class="text-white/70">and surrounding areas</p>
      </div>
      {% endif %}
    </div>
  </div>
</section>
