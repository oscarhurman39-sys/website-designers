{# Services "tiles": centred heading, accent-tinted tiles with a big check. #}
{% if service_items %}
<section id="services" class="max-w-6xl mx-auto px-6 py-20 text-center">
  <p class="text-sm font-semibold uppercase tracking-widest text-[var(--accent)]">{{ nav[0] }}</p>
  <h2 class="mt-2 text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900">{{ services_heading }}</h2>
  <p class="mx-auto mt-4 max-w-xl text-slate-600">{{ trust_line }}</p>
  <div class="mt-12 grid gap-5 sm:grid-cols-2 lg:grid-cols-3 text-left">
    {% for item in service_items %}
    <div class="rounded-2xl p-6 transition hover:-translate-y-0.5" style="background: color-mix(in srgb, var(--accent) 8%, white)">
      <div class="h-11 w-11 rounded-full bg-[var(--accent)] text-white flex items-center justify-center text-lg font-bold shadow">✓</div>
      <h3 class="mt-5 text-lg font-bold text-slate-900">{{ item.name }}</h3>
      <p class="mt-1 text-sm text-slate-600">{{ item.blurb }}</p>
    </div>
    {% endfor %}
  </div>
</section>
{% endif %}
